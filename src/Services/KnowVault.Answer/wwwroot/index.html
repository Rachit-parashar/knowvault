<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KnowVault</title>
<style>
  :root { --bg:#0f1420; --panel:#1a2233; --text:#e6ecf5; --dim:#8b98ad; --accent:#4da3ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.6 system-ui,Segoe UI,sans-serif;
         max-width:780px; margin:0 auto; padding:24px 16px 120px; }
  h1 { font-size:20px; margin-bottom:4px; }
  h1 span { color:var(--accent); }
  .tag { color:var(--dim); font-size:13px; margin-bottom:24px; }
  .tag select { background:var(--panel); color:var(--text); border:1px solid #2a3550; border-radius:6px; padding:2px 6px; }
  .qa { margin-bottom:20px; }
  .q { background:var(--panel); border-radius:10px 10px 10px 2px; padding:10px 14px;
       display:inline-block; max-width:90%; }
  .a { padding:12px 2px; white-space:pre-wrap; }
  .a .cite { color:var(--accent); font-weight:600; cursor:pointer; }
  .sources { border-top:1px solid #2a3550; margin-top:8px; padding-top:8px; font-size:13px; color:var(--dim); }
  .sources div { margin:2px 0; }
  .sources a { color:var(--accent); text-decoration:none; }
  form { position:fixed; bottom:0; left:0; right:0; background:var(--bg); padding:16px;
         border-top:1px solid #2a3550; }
  .row { max-width:780px; margin:0 auto; display:flex; gap:8px; }
  input[type=text] { flex:1; background:var(--panel); border:1px solid #2a3550; color:var(--text);
         border-radius:8px; padding:12px 14px; font-size:15px; outline:none; }
  input[type=text]:focus { border-color:var(--accent); }
  button { background:var(--accent); border:0; color:#08111f; font-weight:700; border-radius:8px;
           padding:0 22px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .thinking { color:var(--dim); font-style:italic; }
</style>
</head>
<body>
  <h1>Know<span>Vault</span></h1>
  <div class="tag">
    Ask a question — answers come only from documents <i>you</i> can see, with citations.
    &nbsp;Tenant <select id="tenant"><option>eval</option><option>demo</option></select>
    &nbsp;User <select id="user"><option>reader</option><option>alice</option><option>mallory</option></select>
  </div>
  <div id="log"></div>
  <form id="form">
    <div class="row">
      <input id="question" type="text" placeholder="e.g. Does Container Apps support scaling to zero?" autocomplete="off" autofocus>
      <button id="send" type="submit">Ask</button>
    </div>
  </form>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("question");
const send = document.getElementById("send");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  send.disabled = true;

  const qa = document.createElement("div");
  qa.className = "qa";
  qa.innerHTML = `<div class="q"></div><div class="a"><span class="thinking">Searching your documents…</span></div><div class="sources"></div>`;
  qa.querySelector(".q").textContent = question;
  log.appendChild(qa);
  qa.scrollIntoView({ behavior: "smooth", block: "end" });

  const answerEl = qa.querySelector(".a");
  const sourcesEl = qa.querySelector(".sources");
  let sources = [], text = "";

  try {
    const res = await fetch("/api/answer", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Dev-Tenant": document.getElementById("tenant").value,
        "X-Dev-User": document.getElementById("user").value
      },
      body: JSON.stringify({ question })
    });
    if (!res.ok) throw new Error(await res.text());

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let sep;
      while ((sep = buffer.indexOf("\n\n")) >= 0) {
        const frame = buffer.slice(0, sep); buffer = buffer.slice(sep + 2);
        const event = (frame.match(/^event: (.*)$/m) || [])[1];
        const data = (frame.match(/^data: (.*)$/m) || [])[1];
        if (event === "sources") {
          sources = JSON.parse(data);
          sourcesEl.innerHTML = sources.map(s =>
            `<div>[${s.marker}] ${s.sourceUrl ? `<a href="${s.sourceUrl}" target="_blank">${esc(s.title)}</a>` : esc(s.title)}</div>`).join("");
        } else if (event === "token") {
          text += JSON.parse(data);
          answerEl.innerHTML = render(text);
          qa.scrollIntoView({ behavior: "auto", block: "end" });
        }
      }
    }
  } catch (err) {
    answerEl.textContent = "Something went wrong: " + err.message;
  } finally {
    send.disabled = false;
    input.focus();
  }
});

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
function render(t) { return esc(t).replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>'); }
</script>
</body>
</html>
